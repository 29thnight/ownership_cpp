name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.compiler }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        mode: [debug, release, asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04 kernels use more mmap randomness than the sanitizer
      # runtimes accept; TSan and ASan abort at startup without this.
      - name: Reduce ASLR entropy for sanitizers
        if: matrix.mode == 'asan' || matrix.mode == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Compiler version
        run: ${{ matrix.compiler }} --version
      - name: Run test suite
        env:
          CXX: ${{ matrix.compiler }}
        run: ./scripts/test.sh ${{ matrix.mode }} 2>&1 | tee test.log; exit "${PIPESTATUS[0]}"
      - name: Annotate failures
        if: failure()
        run: ./scripts/ci_annotate.sh test.log "test (${{ matrix.compiler }}, ${{ matrix.mode }})"

  cmake:
    name: cmake (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default Visual Studio generator follows the runner image's VS.
          - name: msvc
            os: windows-latest
            configure: -A x64
          - name: clang-cl
            os: windows-latest
            configure: -A x64 -T ClangCL
          - name: gcc
            os: ubuntu-24.04
            configure: -G "Ninja Multi-Config" -DCMAKE_CXX_COMPILER=g++
          - name: clang
            os: ubuntu-24.04
            configure: -G "Ninja Multi-Config" -DCMAKE_CXX_COMPILER=clang++
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }} 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - name: Build (Debug)
        run: cmake --build build --config Debug --parallel 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - name: Test (Debug)
        run: ctest --test-dir build -C Debug --output-on-failure --parallel 4 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - name: Build (Release)
        run: cmake --build build --config Release --parallel 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - name: Test (Release)
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - name: Annotate failures
        if: failure()
        run: ./scripts/ci_annotate.sh ci.log "cmake (${{ matrix.name }})"

  benchmarks:
    name: benchmarks build and smoke run (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Compile every benchmark harness
        run: |
          for source in benchmarks/ownership_bench.cpp benchmarks/unique_bench.cpp benchmarks/refcount_scaling.cpp benchmarks/control_block_layout.cpp benchmarks/allocated_unique_layout.cpp; do
            ${{ matrix.compiler }} -std=c++20 -O2 -DNDEBUG -pthread -Wall -Wextra -Wpedantic -Werror -Iinclude -c "$source" -o /dev/null
          done
      # Timing on shared CI runners is not evidence; this checks that the
      # harness builds, runs and passes its own per-sample verification.
      - name: Contention scaling smoke run
        env:
          CXX: ${{ matrix.compiler }}
          QUICK: "1"
          BENCH_OUTPUT: ${{ runner.temp }}/scaling
        run: ./scripts/benchmark_scaling.sh --pin 1
      - name: Control-block layout smoke run
        env:
          CXX: ${{ matrix.compiler }}
          QUICK: "1"
          BENCH_OUTPUT: ${{ runner.temp }}/layout
        run: ./scripts/benchmark_layout.sh --pin 1
      - name: Allocated unique layout smoke run
        env:
          CXX: ${{ matrix.compiler }}
          QUICK: "1"
          BENCH_OUTPUT: ${{ runner.temp }}/allocated_unique
        run: ./scripts/benchmark_allocated_unique.sh
      - name: Examples
        run: make example CXX=${{ matrix.compiler }}
